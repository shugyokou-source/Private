name: kaigo-daily

# 每天北京时间早上 8 点（JST 9 点）运行；也可手动触发
on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 北京时间次日 07:00 = JST 08:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaigo-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run daily pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          AI_ENRICH_MAX: "40"
        run: python run_daily.py

      - name: Commit archive
        run: |
          git config user.name "kaigo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/items.json data/summary_cache.json data/latest.json out/
          git diff --cached --quiet && echo "无变化，跳过提交" || git commit -m "daily update $(date -u +%F)"
          git pull --rebase --autostash origin main || true
          git push

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaigo-out
          path: |
            out/kaigo.html
            out/summary_10y.md
            out/daily.md
            out/archive.csv
          retention-days: 90

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          keep_files: |
            kaigo.html
